name: Deploy SPA to VPS (atomic)
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack release
        run: tar -C dist -czf release.tgz .

      - name: Copy tar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "release.tgz"
          target: "/home/gitlab-deploy/frontend/releases/${{ github.sha }}/"

      - name: Activate release (symlink switch + cleanup)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            BASE="/home/gitlab-deploy/frontend"
            REL="$BASE/releases/$GITHUB_SHA"
            mkdir -p "$REL"
            tar -xzf "$REL/release.tgz" -C "$REL"
            ln -sfn "$REL" "$BASE/current"
#            sudo systemctl reload nginx
            ls -1dt "$BASE/releases"/* | tail -n +6 | xargs -r rm -rf
